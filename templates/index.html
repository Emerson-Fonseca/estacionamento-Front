
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResenhaEstacionamentos</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <header>
        <h1>Estacionamento Shopping </h1>
        <p>Painel de disponibilidade de vagas</p>
    </header>

    <main>

        <button id="conectarArduino">
        Conectar Arduino
        </button>

        <p id="statusArduino">
         Arduino desconectado
        </p>



        <svg id="estacionamento"
             viewBox="0 0 1000 700"
             xmlns="http://www.w3.org/2000/svg">

            <!-- parte do shopping -->
            <rect x="50" y="20"
                  width="250" height="200"
                  class="shopping"/>

            <text x="175" y="135"
                  class="texto-shopping">
                SHOPPING
            </text>



            <!-- vaga1 -->
            <rect x="370" y="50"
                  width="100" height="150"
                  class="vaga"/>

            <circle id="vaga-1"
                    cx="420" cy="85"
                    r="12" class="indisponivel"/>



            <!-- vaga2 -->
            <rect x="480" y="50"
                  width="100" height="150"
                  class="vaga"/>

            <circle id="vaga-2"
                    cx="530" cy="85"
                    r="12" class="indisponivel"/>



            <!-- vaga3 -->
            <rect x="590" y="50"
                  width="100" height="150"
                  class="vaga"/>

            <circle id="vaga-3"
                    cx="640" cy="85"
                    r="12" class="indisponivel"/>
                




            <!-- as parede tudo ai -->  
            <rect class="parede"
                x="235"
                y="450"
                width="600"
                height="5"
                fill="#151515"
            />

             <rect class="parede"
                x="235"
                y="450"
                width="5"
                height="450"
                fill="#151515"
            />

            <rect class="parede"
                x="15"
                y="3"
                width="5"
                height="2000"
                fill="#151515"
            />

            <rect class="parede"
                x="23"
                y="3"
                width="1000"
                height="5"
                fill="#151515"
            />

            <rect class="parede"
                x="990"
                y="3"
                width="5"
                height="2000"
                fill="#151515"
            />

             <rect class="parede"
                x="830"
                y="450"
                width="5"
                height="450"
                fill="#151515"
            />




            <!-- entrada -->
            <text x="60" y="650" class="entrada">
                ENTRADA
            </text>

            <!-- saida -->
            <text x="875" y="650" class="saida">
                SAÍDA
            </text>

        </svg>
    </main>

    <script src="../static/script.js"></script>
</body>
</html>
